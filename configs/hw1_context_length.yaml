# HW1 Task 3 -- context length: LSTM vs. modern Transformer at train.seq_len = 64 / 128 / 256 / 512.
#
# Controlled comparison: only the context length changes.
#   - batch_size x seq_len = 8192 tokens/step for every run, so all runs see the same
#     16.4M training tokens in the same 2000 optimizer steps (same LR schedule).
#   - Model settings are identical to the `lstm` and `gpt_modern` runs of sweeps/01_char_models.yaml,
#     so the seq_len=256 rows here reproduce those Task 2 runs.
#   - eval.eval_seq_len is left at 0 (= train.seq_len): each model is evaluated with the same
#     context length it was trained with.
#
# Run from DeepDataMiningLearning/DeepDataMiningLearning/llm:
#   python -m nanolm.sweep   --sweep ../../../configs/hw1_context_length.yaml
#   python -m nanolm.analyze outputs/nanolm/sweeps/hw1_context_length --baseline gpt_modern_T256 --metric val_bpb
name: hw1_context_length
base: ../DeepDataMiningLearning/DeepDataMiningLearning/llm/nanolm/configs/02_char_transformer.yaml
seeds: [1337, 42]
common:
  train.max_steps: 2000
runs:
  - name: lstm_T64
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 64, train.batch_size: 128}
  - name: lstm_T128
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 128, train.batch_size: 64}
  - name: lstm_T256
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 256, train.batch_size: 32}
  - name: lstm_T512
    overrides: {model.arch: lstm, model.n_layers: 2, model.dim: 256, train.lr: 2e-3, train.weight_decay: 0.0, train.seq_len: 512, train.batch_size: 16}
  - name: gpt_modern_T64
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 64, train.batch_size: 128}
  - name: gpt_modern_T128
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 128, train.batch_size: 64}
  - name: gpt_modern_T256
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 256, train.batch_size: 32}
  - name: gpt_modern_T512
    overrides: {model.norm: rmsnorm, model.pos: rope, model.mlp: swiglu, model.bias: false, train.seq_len: 512, train.batch_size: 16}
