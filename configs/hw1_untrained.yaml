# HW1 Task 1 -- loss of an untrained model, for two tokenizers, to compare with ln V.
#   char: V = 65  -> ln V = 4.174        byte: V = 256 -> ln V = 5.545
#
# train.max_steps=1 (the tutorial's suggestion): nanolm has no evaluation at step 0, so the model
# takes exactly one AdamW step, at the warm-up learning rate 1e-3 x 1/100 = 1e-5, before it is
# evaluated. It is therefore "almost", not strictly, untrained.
#
# Run from DeepDataMiningLearning/DeepDataMiningLearning/llm:
#   python -m nanolm.sweep   --sweep ../../../configs/hw1_untrained.yaml
#   python -m nanolm.analyze outputs/nanolm/sweeps/hw1_untrained --baseline char --metric val_bpb
name: hw1_untrained
base: ../DeepDataMiningLearning/DeepDataMiningLearning/llm/nanolm/configs/02b_char_transformer_modern.yaml
seeds: [1337, 42]
common:
  train.max_steps: 1
runs:
  - name: char
    overrides: {data.tokenizer: char}
  - name: byte
    overrides: {data.tokenizer: byte}
